name: Release

on:
  workflow_dispatch:

permissions:
  contents: write # required to create the draft GitHub release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The key tests run real ssh-keygen commands. Hosted Ubuntu images normally
      # include openssh-client, but slim/container images do not, so install it
      # explicitly here.
      - name: Install OpenSSH client (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Verify OpenSSH tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($tool in 'ssh-keygen', 'ssh-add', 'ssh') {
            $command = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $command) { throw "Missing OpenSSH tool: $tool" }
            Write-Host "$tool -> $($command.Source)"
          }

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  # One version for every artifact in the run. Matrix legs cannot reliably share
  # outputs, so calculate it once here instead of once per runner.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Calculate version
        id: version
        run: echo "value=$(date -u +%y.%m.%d.%H%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, version]
    name: Publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        # runner label        runtime identifier
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}

    env:
      DeploymentDirectory: deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish src/SshKeyManager/SshKeyManager.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.version.outputs.value }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ${{ env.DeploymentDirectory }}/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            ${{ env.DeploymentDirectory }}/${{ matrix.rid }}/**
            !${{ env.DeploymentDirectory }}/${{ matrix.rid }}/**/*.pdb
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build, version]
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: artifacts/win-x64

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: artifacts/linux-x64

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.value }}"

          (cd artifacts/win-x64 && zip -r "../SshKeyManager-${VERSION}-win-x64.zip" .)

          # Artifact upload does not preserve the executable bit.
          chmod +x artifacts/linux-x64/SshKeyManager
          tar -czf "artifacts/SshKeyManager-${VERSION}-linux-x64.tar.gz" -C artifacts/linux-x64 .

      - name: Generate release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: v${{ needs.version.outputs.value }}
          files: |
            artifacts/SshKeyManager-${{ needs.version.outputs.value }}-win-x64.zip
            artifacts/SshKeyManager-${{ needs.version.outputs.value }}-linux-x64.tar.gz
